    <text x="35" y="155" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">"protocol_id": <tspan fill="#f59e0b">"0x00 (PnP Discovery)"</tspan>,</text>
    <text x="35" y="175" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">"wire_hex": <tspan fill="#38bdf8">"400002504E50"</tspan>,</text>
    <text x="35" y="195" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">"vendor_id": <tspan fill="#cbd5e1">"0x0045 (Sodern/Bradford)"</tspan>,</text>
    <text x="35" y="215" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">"product_id": <tspan fill="#cbd5e1">"0x0810 (SED26)"</tspan>,</text>
    <text x="35" y="235" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">"seds_linked": <tspan fill="#10b981">"VERIFIED_AVAILABLE"</tspan></text>
    <text x="25" y="255" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8">}</text>

