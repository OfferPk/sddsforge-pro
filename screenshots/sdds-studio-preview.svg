    <text x="25" y="273" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e5ff">Live SOIS SDDS Discovery Event Stream:</text>
    <text x="25" y="295" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8">&gt; DEVICE_DISCOVERY.request(Target=BROADCAST_SCAN)</text>
    <text x="25" y="313" font-family="JetBrains Mono, monospace" font-size="10" fill="#10b981">&gt; DEVICE_DISCOVERY.indication(Addr=0x40, Mode=SOLICITED, Type=ATTITUDE_SENSOR)</text>
