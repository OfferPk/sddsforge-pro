    <rect x="720" y="0" width="220" height="65" rx="6" fill="#121b2d" stroke="#22324e"/>
    <text x="735" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Device Loss Alarms</text>
