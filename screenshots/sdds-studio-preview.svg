    <text x="255" y="52" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#00e5ff">SpW / 1553B / CAN</text>

    <!-- Card 3 -->
    <rect x="480" y="0" width="220" height="65" rx="6" fill="#121b2d" stroke="#22324e"/>
    <text x="495" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">PnP Discovery Mechanism</text>
    <text x="495" y="52" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#38bdf8">Solicited / Autonomous</text>

