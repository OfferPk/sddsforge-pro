    <text x="25" y="75" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8">{</text>
    <text x="35" y="95" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">"subnetwork_bus": <tspan fill="#34d399">"SpaceWire PnP"</tspan>,</text>
