      <text x="15" y="169" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#ffab00">Node 0x04: Pitch Axis Reaction Wheel (HR16)</text>
      <text x="360" y="169" font-family="JetBrains Mono, monospace" font-size="10" fill="#10b981">MIL-STD-1553B [ONLINE]</text>
    </g>

