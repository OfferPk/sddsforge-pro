    <text x="25" y="330" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff">COMPLIANCE AUDIT VERDICT:</text>
    <text x="25" y="352" font-family="JetBrains Mono, monospace" font-size="10" fill="#a7f3d0">• Status: CCSDS_854_0_SDDS_CERTIFIED</text>
    <text x="25" y="370" font-family="JetBrains Mono, monospace" font-size="10" fill="#a7f3d0">• Normative Score: 10/10 PASS (100.0%)</text>
    <text x="25" y="388" font-family="JetBrains Mono, monospace" font-size="10" fill="#a7f3d0">• Solicited &amp; Autonomous Modes Verified</text>
    <text x="25" y="406" font-family="JetBrains Mono, monospace" font-size="10" fill="#a7f3d0">• SpaceWire, 1553B &amp; CAN PnP Operational</text>
